name: Benchmarks Linux controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3c79abad4d2941509847d1396736d7e4ecdb1fed
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: fc3dce8087066a984799e185e1a421dc5e60bf7b
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install both immutable revisions before measuring
        run: |
          (cd baseline && bun install --frozen-lockfile)
          (cd candidate && bun install --frozen-lockfile)
          mkdir controls
          diff -r baseline/src candidate/src
          diff -r baseline/test/perf candidate/test/perf
          diff -r baseline/scripts candidate/scripts
          lscpu > controls/cpu.txt
      - name: Interleave full unchanged harness B1 H1 B2 H2 B3
        run: |
          for label in B1 H1 B2 H2 B3; do
            revision=baseline
            if [[ "$label" == H* ]]; then revision=candidate; fi
            (cd "$revision" && bun run perf:run -- --gha-output "../controls/$label.json") 2>&1 | tee "controls/$label.log"
            cp "$revision"/perf-results/*-raw.json "controls/$label-raw.json"
            rm "$revision"/perf-results/*-raw.json
          done
      - name: Record original comparison gate for every control pair
        if: always()
        run: |
          set +e
          for pair in B1:B2 B2:B3 B1:H1 B2:H1 B2:H2 B3:H2; do
            base="${pair%:*}"
            head="${pair#*:}"
            (cd baseline && bun run perf:compare -- --threshold 5 --fail-on-regression --allow-new "../controls/$base.json" "../controls/$head.json") > "controls/$base-$head.txt" 2>&1
            printf '%s %s\n' "$pair" "$?" >> controls/comparison-status.txt
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: immutable-linux-controls
          path: controls/
          if-no-files-found: error
