name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier --check .

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: CI=1 bun run test

      - name: Build package
        run: bun run build

      - name: Validate npm pack
        run: bun run check:package

  duckdb-floor:
    name: Test (@duckdb/node-api ${{ matrix.node-api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest release of each DuckDB minor line in the peer range.
        node-api: ['1.4.4-r.1', '1.5.0-r.1']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install floor @duckdb/node-api
        env:
          NODE_API_VERSION: ${{ matrix.node-api }}
        run: |
          bun add --dev --no-save "@duckdb/node-api@${NODE_API_VERSION}"
          installed=$(node -p "require('@duckdb/node-api/package.json').version")
          if [ "$installed" != "$NODE_API_VERSION" ]; then
            echo "::error::Expected @duckdb/node-api ${NODE_API_VERSION}, found ${installed}"
            exit 1
          fi

      - name: Type check floor bindings
        run: bun run typecheck

      - name: Run tests
        # Older clients may download optional extensions during these tests.
        run: CI=1 bun run test -- --testTimeout 60000 --hookTimeout 60000

  drizzle-floor:
    name: Drizzle minimum version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun add --dev --no-save drizzle-orm@0.40.1
      - run: bun run typecheck
      - run: CI=1 bun run test
      - run: bun run build
      - run: bun run check:package
        env:
          CONSUMER_DRIZZLE_VERSION: '0.40.1'

  runtime-floor:
    name: Packed consumer on minimum Node runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@v7
        with:
          node-version: '18.17.0'
          package-manager-cache: false
      - run: bun run check:package

  ducklake:
    name: Required DuckLake integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun run test -- test/ducklake.integration.test.ts
        env:
          REQUIRE_DUCKLAKE: '1'
